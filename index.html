<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mute Toggle -->
    <button class="mute-toggle" id="muteToggle" aria-label="Toggle sound effects" title="Toggle audio">
        <svg id="speakerIcon" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
    </button>

    <!-- Top Header -->
    <div class="top-header">
        <h1 class="main-title">OTP Verification</h1>
        <div class="sub-header-title">CodeaConHoracio</div>
    </div>

    <!-- Main Card Container -->
    <div class="card-wrapper">
        <div class="otp-card" id="otpCard">
            <div class="grabber"></div>
            <div class="card-title" id="cardTitle" aria-live="polite">Verify your number</div>
            <div class="card-subtitle" id="cardSubtitle">Enter the 4-digit code we sent to <strong>+51 934 ••• 0142</strong>.</div>

            <!-- OTP Interactive Area -->
            <div class="otp-container" id="otpContainer">
                <canvas class="particle-canvas" id="particleCanvas"></canvas>

                <!-- Hidden Input for mobile & autofill -->
                <input type="tel" inputmode="numeric" maxlength="4" autocomplete="one-time-code" class="real-input" id="realInput" aria-label="One-time verification code">

                <!-- Phase 1: Horizontal Grid -->
                <div class="digits-grid" id="digitsGrid" role="group" aria-label="OTP digit inputs">
                    <div class="focus-ring" id="focusRing"></div>
                    <div class="digit-box" data-index="0" tabindex="0" aria-label="Digit 1">
                        <div class="empty-circle"></div>
                    </div>
                    <div class="digit-box" data-index="1" tabindex="0" aria-label="Digit 2"></div>
                    <div class="digit-box" data-index="2" tabindex="0" aria-label="Digit 3"></div>
                    <div class="digit-box" data-index="3" tabindex="0" aria-label="Digit 4"></div>
                </div>

                <!-- Phase 2 & 3: Orbit Formation -->
                <div class="orbit-area" id="orbitArea">
                    <div class="orbit-ring" id="orbitRing"></div>
                    <div class="orbit-center-dot" id="orbitCenterDot"></div>
                    <!-- Orbit Items mapped to visual order: top (7), left (4), right (1), bottom (9) -->
                    <div class="orbit-item" id="orbitItem0" style="top: 0px; left: 55px;" data-digit="3">3</div>
                    <div class="orbit-item" id="orbitItem1" style="top: 55px; left: 0px;" data-digit="2">2</div>
                    <div class="orbit-item" id="orbitItem2" style="top: 55px; left: 110px;" data-digit="6">6</div>
                    <div class="orbit-item" id="orbitItem3" style="top: 110px; left: 55px;" data-digit="5">5</div>
                </div>

                <!-- Converged Box & Checkmark (Phase 3 & 4) -->
                <div class="converged-box" id="convergedBox">
                    <svg class="checkmark-svg" viewBox="0 0 24 24">
                        <path class="checkmark-path" d="M4 12l6 6L20 6"></path>
                    </svg>
                </div>

                <!-- Ripple Concluding Rings -->
                <div class="ripple-ring" id="ripple1"></div>
                <div class="ripple-ring" id="ripple2"></div>
                <div class="ripple-ring" id="ripple3"></div>
                <div class="halo" id="halo1"></div>
                <div class="halo" id="halo2"></div>
                <div class="merge-flash" id="mergeFlash"></div>
            </div>

            <!-- Bottom Action Area -->
            <div class="bottom-action-area">
                <!-- Phase 1 Notification Bar -->
                <div class="notification-bar" id="notificationBar">
                    <div class="notification-left">
                        <div class="notification-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                            </svg>
                        </div>
                        <div class="notification-text-wrap">
                            <div class="notification-label">MESSAGE · OTP</div>
                            <div class="notification-message"><strong>2365</strong> is your verification code.</div>
                        </div>
                    </div>
                    <button class="fill-btn" id="fillBtn">Fill</button>
                </div>

                <!-- Phase 2 Countdown Area -->
                <div class="countdown-area" id="countdownArea">
                    Didn't receive the code? <span class="resend-link disabled" id="resendLink">Resend in <span id="timerSec">24</span>s</span>
                </div>

                <!-- Phase 4 Success Footer Area -->
                <div class="success-footer-area" id="successFooterArea">
                    <div class="secure-badge">
                        <svg viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        Verified and secure
                    </div>
                    <button class="continue-btn" id="continueBtn">Continue</button>
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <button class="replay-btn" id="replayBtn" style="display: none;">Replay Animation</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
